<svg width="680" height="734" viewBox="0 0 680 734" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Lanes -->
  <rect x="40" y="20" width="580" height="110" rx="16" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="44" font-size="14" font-weight="600" fill="#2C2C2A">Customer</text>

  <rect x="40" y="140" width="580" height="110" rx="16" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="164" font-size="14" font-weight="600" fill="#2C2C2A">POS &amp; MySQL system</text>

  <rect x="40" y="260" width="580" height="110" rx="16" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="284" font-size="14" font-weight="600" fill="#2C2C2A">Power BI / Power Query</text>

  <rect x="40" y="380" width="580" height="334" rx="16" fill="#FAFAF8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="56" y="404" font-size="14" font-weight="600" fill="#2C2C2A">Store manager</text>

  <!-- Start event -->
  <circle cx="330" cy="70" r="18" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
  <text x="330" y="102" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Order placed</text>
  <line x1="330" y1="106" x2="330" y2="167" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Task: POS -->
  <rect x="160" y="167" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="330" y="191" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Order recorded</text>
  <text x="330" y="209" text-anchor="middle" font-size="12" fill="#085041">POS, MySQL &amp; Excel</text>
  <line x1="330" y1="223" x2="330" y2="287" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Task: Power BI -->
  <rect x="160" y="287" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="330" y="311" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Power BI dashboard</text>
  <text x="330" y="329" text-anchor="middle" font-size="12" fill="#085041">Auto-refreshed via Power Query</text>
  <line x1="330" y1="343" x2="330" y2="400" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Task: Manager review -->
  <rect x="160" y="400" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text x="330" y="424" text-anchor="middle" font-size="14" font-weight="600" fill="#04342C">Manager reviews dashboard</text>
  <text x="330" y="442" text-anchor="middle" font-size="12" fill="#085041">Checks KPIs &amp; trends</text>
  <line x1="330" y1="456" x2="330" y2="516" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- Gateway -->
  <rect x="305" y="526" width="50" height="50" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="1" transform="rotate(45 330 551)"/>

  <!-- Branches -->
  <path d="M330 587 L330 620 L200 620 L200 630" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <path d="M330 587 L330 620 L460 620 L460 630" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="265" y="612" text-anchor="middle" font-size="12" fill="#5F5E5A">Yes</text>
  <text x="395" y="612" text-anchor="middle" font-size="12" fill="#5F5E5A">No</text>

  <!-- End events -->
  <circle cx="200" cy="650" r="20" fill="#E1F5EE" stroke="#1D9E75" stroke-width="2"/>
  <text x="200" y="694" text-anchor="middle" font-size="12" fill="#2C2C2A">Adjust staffing/inventory</text>

  <circle cx="460" cy="650" r="20" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="2"/>
  <text x="460" y="694" text-anchor="middle" font-size="12" fill="#2C2C2A">Continue monitoring</text>
</svg>
